<html>
  <head>
    <meta charset="UTF-8" />
    <script src="RAWG.js"></script>
    <link rel="stylesheet" href="jgs.css" />
  </head>
  <body onload="procurarJogos()">
    <header>
      <img src="./Imagens/Logged 4-Photoroom.png" class="logo" />
      <h1>Biblioteca Gamer</h1>
      <div class="busca">
        <input
          type="text"
          placeholder="Buscar jogos...."
          oninput="buscaInt()"
          id="pesquisa"
        />
        <button>🔍</button>
      </div>
    </header>
    <h2>
      Conheça novos jogos , leia nossas reviews para ajudar na hora de comprar
      um novo jogo!!!
    </h2>
    <main class="conte">
      <aside class="gen">
        <button onclick="filtroGen('')">Todos</button>
        <button onclick="filtroGen('role-playing-games-rpg')">RPG</button>
        <button onclick="filtroGen('action')">Açao</button>
        <button onclick="filtroGen('horror')">Terror</button>
      </aside>
      <section id="games"></section>
    </main>
    <div class="paginas">
      <button onclick="voltarP()"><</button>
      <span id="pag">1</span>
      <button onclick="proximaP()">></button>
    </div>
  </body>
</html>
